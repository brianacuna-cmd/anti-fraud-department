services:
  mongo:
    image: mongo:7
    container_name: anti-fraud-department-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      # 27017 lo ocupa el mongod de Homebrew (standalone, sin replSet).
      # Publicamos en 27018; dentro del contenedor mongod sigue en 27017,
      # que es el host que usa la config de rs0.
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: |
        mongosh --quiet --eval "
          try {
            rs.status();
          } catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] });
          }
        "
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Antivirus de evidencias (INV-015). El backend le habla por INSTREAM: los
  # bytes viajan por el socket y clamd NO comparte disco, que es lo que permite
  # escanear ANTES de guardar nada en el almacen.
  #
  # El primer arranque tarda: freshclam se descarga la base de firmas (~250 MB)
  # y hasta que termina el healthcheck no pasa a healthy.
  clamav:
    image: clamav/clamav:1.4
    # ClamAV solo publica amd64. En Apple Silicon corre emulado —lento pero
    # funcional para desarrollo—; en un servidor x86 es nativo. NO se sustituye
    # por una imagen comunitaria de arm64: es el componente que decide si un
    # fichero entra al expediente, y ahi la procedencia importa mas que la
    # velocidad.
    platform: linux/amd64
    container_name: anti-fraud-department-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 240s

  # Outbox relay destination (KRaft combined mode, no ZooKeeper).
  # Host clients (pnpm dev) use localhost:9092; other containers use kafka:19092.
  kafka:
    image: apache/kafka:4.3.1
    container_name: anti-fraud-department-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Browser UI for the broker. Kafka itself has no HTTP interface on 9092 —
  # that port is the binary protocol used by producers/consumers.
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: anti-fraud-department-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  mongo_data:
    name: anti-fraud-department-mongo-data
  clamav_db:
    name: anti-fraud-department-clamav-db
